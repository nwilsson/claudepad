name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      # validate, plugin tests, manifest versions; tsc needs the types the
      # engine lays on a live load, so it runs locally only
      - run: ./scripts/check.sh
